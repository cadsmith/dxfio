name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_COMPILERCHECK: content

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install clang-format 23
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-format-23

      - name: Format
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format-23 --dry-run --Werror

      - name: CMake guidelines
        run: |
          status=0
          for file in $(git ls-files 'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake'); do
            awk -v file="$file" '
              length > 80 { print file ":" NR ": over 80 columns"; bad = 1 }
              /^[ \t]*#/ { print file ":" NR ": comment"; bad = 1 }
              END { exit bad }' "$file" || status=1
          done
          exit "$status"

      - name: Public interface snapshot
        run: >
          cmake -DAPI_ROOT=$PWD/include
          -DAPI_SNAPSHOT=$PWD/tests/api/snapshot.txt
          -DAPI_CURRENT=$RUNNER_TEMP/snapshot.txt
          -P tests/api/snapshot.cmake

      - name: Pull request title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >
            The description must start lowercase, use the imperative mood and
            not end with a period (docs/commit.md).

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-26.04
            preset: release
            cxx: g++-15
            launcher: ccache
          - name: linux-clang
            os: ubuntu-26.04
            preset: release
            cxx: /usr/lib/llvm-22/bin/clang++
            launcher: ccache
          - name: macos
            os: macos-26
            preset: release
            cxx: c++
            launcher: ccache
          - name: windows
            os: windows-2025
            preset: release
            cxx: cl
            launcher: sccache
            experimental: true
          - name: sanitize
            os: ubuntu-26.04
            preset: sanitize
            cxx: /usr/lib/llvm-22/bin/clang++
            launcher: ccache
          - name: coverage
            os: ubuntu-26.04
            preset: coverage
            cxx: /usr/lib/llvm-22/bin/clang++
            launcher: ccache
    env:
      CXX: ${{ matrix.cxx }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.launcher }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'

      # Only a push to main saves: a pull request can read main's cache but
      # nobody else can read a pull request's, and one entry per job per push
      # keeps the repository well inside its 10 GB quota.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.launcher }}
          max-size: 300M
          save: ${{ github.event_name == 'push' }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.preset != 'coverage'
        run: ctest --preset ${{ matrix.preset }} --parallel 4

      - name: Coverage
        if: matrix.preset == 'coverage'
        run: cmake --build --preset coverage --target coverage

  tidy:
    name: tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CXX: /usr/lib/llvm-23/bin/clang++
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7.0.1

      # The same major as the Homebrew LLVM used locally: .clang-tidy names
      # checks that older releases do not have.
      - name: Install LLVM 23
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-23 clang-tidy-23

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: tidy
          max-size: 300M
          save: ${{ github.event_name == 'push' }}

      - name: Configure
        run: cmake --preset tidy -DDXFIO_CLANG_TIDY=/usr/lib/llvm-23/bin/clang-tidy

      - name: Build
        run: cmake --build --preset tidy
