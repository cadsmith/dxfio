name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_COMPILERCHECK: content
  CCACHE_DEPEND: true

jobs:
  # Which files a pull request touches: docs, the site and Markdown alone
  # need no C++ job. A job skipped by its condition still reports success,
  # so it can be required; a workflow filtered by paths could not.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - CMakeLists.txt
              - CMakePresets.json
              - .clang-format
              - .clang-tidy
              - .github/workflows/ci.yml
              - include/**
              - source/**
              - tests/**
              - tools/tidy/**
              - cmake/**
              - vendor/**

  check:
    name: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/llvm
        with:
          packages: clang-format-23

      - name: Format
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format-23 --dry-run --Werror

      - name: CMake guidelines
        run: |
          status=0
          for file in $(git ls-files 'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake'); do
            awk -v file="$file" '
              length > 80 { print file ":" NR ": over 80 columns"; bad = 1 }
              /^[ \t]*#/ { print file ":" NR ": comment"; bad = 1 }
              END { exit bad }' "$file" || status=1
          done
          exit "$status"

      - name: Public interface snapshot
        run: >
          cmake -DAPI_ROOT=$PWD/include
          -DAPI_SNAPSHOT=$PWD/tests/api/snapshot.txt
          -DAPI_CURRENT=$RUNNER_TEMP/snapshot.txt
          -P tests/api/snapshot.cmake

      - name: Pull request title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >
            The description must start lowercase, use the imperative mood and
            not end with a period (docs/commit.md).

  build:
    name: ${{ matrix.name }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-26.04
            preset: release
            cxx: g++-15
            launcher: ccache
            package: true
          - name: linux-clang
            os: ubuntu-26.04
            preset: release
            cxx: /usr/lib/llvm-23/bin/clang++
            launcher: ccache
            packages: clang-23
          - name: macos
            os: macos-26
            preset: release
            cxx: c++
            launcher: ccache
          - name: windows
            os: windows-2025
            preset: release
            cxx: cl
            launcher: sccache
          - name: sanitize
            os: ubuntu-26.04
            preset: sanitize
            cxx: /usr/lib/llvm-23/bin/clang++
            launcher: ccache
            packages: clang-23 libclang-rt-23-dev
            target: dxfio_tests
          - name: thread
            os: ubuntu-26.04
            preset: thread
            cxx: /usr/lib/llvm-23/bin/clang++
            launcher: ccache
            packages: clang-23 libclang-rt-23-dev
            target: dxfio_tests
          - name: coverage
            os: ubuntu-26.04
            preset: coverage
            cxx: /usr/lib/llvm-23/bin/clang++
            launcher: ccache
            packages: clang-23 libclang-rt-23-dev llvm-23
            target: coverage
    env:
      CXX: ${{ matrix.cxx }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.launcher }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'

      - uses: ./.github/actions/llvm
        if: matrix.packages
        with:
          packages: ${{ matrix.packages }}

      # Only a push to main saves: a pull request can read main's cache but
      # nobody else can read a pull request's, and one entry per job per push
      # keeps the repository well inside its 10 GB quota.
      - uses: ./.github/actions/ccache
        if: runner.os != 'Windows'

      - uses: mozilla-actions/sccache-action@v0.0.11
        if: runner.os == 'Windows'
        with:
          version: v0.19.0

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.launcher }}
          install: no
          max-size: 300M
          save: ${{ github.event_name == 'push' }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # The release jobs build everything, the headers-alone check included;
      # sanitize builds the tests alone, and coverage the target that runs
      # them and gates the result.
      - name: Build
        run: >
          cmake --build --preset ${{ matrix.preset }}
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Test
        if: matrix.target != 'coverage'
        run: ctest --preset ${{ matrix.preset }} --parallel 4

      # The figures of one job, on a drawing the generator makes, in the
      # job's summary: a change to the library is measured, not claimed.
      # The bench is built here alone, on request, not by every job.
      - name: Benchmark
        if: matrix.package
        run: |
          cmake --build --preset release --target dxfio_bench
          python3 tools/bench/generate.py \
            tests/fixtures/acad/entities-r2018.dxf 10 "$RUNNER_TEMP/bench.dxf"
          {
            echo '## Benchmark'
            echo '```'
            build/release/bin/dxfio_bench "$RUNNER_TEMP/bench.dxf" 5
            build/release/bin/dxfio_bench "$RUNNER_TEMP/bench.dxf" 5 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The installed package, used the way a consumer would.
      - name: Install and consume
        if: matrix.package
        run: |
          cmake --install build/release --prefix "$RUNNER_TEMP/dxfio"
          cmake -S tests/package -B "$RUNNER_TEMP/consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/dxfio"
          cmake --build "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/dxfio_package" tests/fixtures/acad/entities-r2018.dxf

      # The figure the gate measured, published so the README's badge shows
      # it rather than claims it.
      - name: Export the coverage
        if: matrix.target == 'coverage'
        run: |
          /usr/lib/llvm-23/bin/llvm-cov export build/coverage/bin/dxfio_tests \
            -instr-profile=build/coverage/tests/dxfio_tests.profdata \
            -format=lcov include source \
            | sed "s#^SF:$GITHUB_WORKSPACE/#SF:#" > coverage.lcov

      - uses: coverallsapp/github-action@v2.3.8
        if: matrix.target == 'coverage'
        with:
          file: coverage.lcov
          format: lcov
          fail-on-error: false

  memory:
    name: memory
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DXFIO_MEMORY_LIBCXX: ${{ github.workspace }}/../msan-libcxx
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/llvm
        with:
          packages: clang-23 libclang-rt-23-dev llvm-23

      # MSan needs every C++ library instrumented, so libc++ is built from
      # the compiler's own release once and kept.
      - uses: actions/cache@v6.1.0
        id: libcxx
        with:
          path: ${{ github.workspace }}/../msan-libcxx
          key: msan-libcxx-llvmorg-23.1.5-${{ runner.os }}

      - name: Build a libc++ with MSan
        if: steps.libcxx.outputs.cache-hit != 'true'
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ""
        run: |
          git clone -q --depth 1 --branch llvmorg-23.1.5 \
            https://github.com/llvm/llvm-project "$RUNNER_TEMP/llvm-project"
          cmake -G Ninja -S "$RUNNER_TEMP/llvm-project/runtimes" \
            -B "$RUNNER_TEMP/msan-runtimes" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-23/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-23/bin/clang++ \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
            -DLLVM_USE_SANITIZER=MemoryWithOrigins \
            -DLIBCXX_INCLUDE_TESTS=OFF -DLIBCXXABI_INCLUDE_TESTS=OFF \
            -DLIBUNWIND_INCLUDE_TESTS=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DXFIO_MEMORY_LIBCXX"
          ninja -C "$RUNNER_TEMP/msan-runtimes" \
            install-cxx install-cxxabi install-unwind

      - uses: ./.github/actions/ccache

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: memory
          install: no
          max-size: 300M
          save: ${{ github.event_name == 'push' }}

      - name: Configure
        run: cmake --preset memory -DCMAKE_CXX_COMPILER=/usr/lib/llvm-23/bin/clang++

      - name: Build
        run: cmake --build --preset memory

      - name: Test
        run: ctest --preset memory --parallel 4

  fuzz:
    name: fuzz
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/llvm
        with:
          packages: clang-23 libclang-rt-23-dev llvm-23

      - uses: ./.github/actions/ccache

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: fuzz
          install: no
          max-size: 300M
          save: ${{ github.event_name == 'push' }}

      - name: Configure
        run: cmake --preset fuzz -DCMAKE_CXX_COMPILER=/usr/lib/llvm-23/bin/clang++

      - name: Build
        run: cmake --build --preset fuzz

      # The corpus the scheduled runs grow; a pull request reads it, main's
      # runs save it (see fuzz.yml).
      - uses: actions/cache/restore@v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz each target for a minute
        env:
          LLVM_SYMBOLIZER_PATH: /usr/lib/llvm-23/bin/llvm-symbolizer
        run: |
          mkdir -p "$RUNNER_TEMP/found"
          failed=0
          for target in dxf escapes tags; do
            mkdir -p "corpus/$target"
            "build/fuzz/bin/dxfio_fuzz_$target" \
              -max_total_time=60 \
              -dict=tests/fuzz/dxf.dict \
              -artifact_prefix="$RUNNER_TEMP/found/$target-" \
              "corpus/$target" tests/fuzz/corpus tests/fuzz/found || failed=1
          done
          exit "$failed"

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/found
          if-no-files-found: ignore

  tidy:
    name: tidy
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CXX: /usr/lib/llvm-23/bin/clang++
    steps:
      # The whole history, so a pull request can be diffed from its merge
      # base with main.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The same major as the Homebrew LLVM used locally: .clang-tidy names
      # checks that older releases do not have.
      - uses: ./.github/actions/llvm
        with:
          packages: clang-23 clang-tidy-23

      # Configure alone: clang-tidy reads the compile commands and parses
      # each source itself, so nothing is compiled or linked here.
      - name: Configure
        run: cmake --preset tidy -DDXFIO_CLANG_TIDY=/usr/lib/llvm-23/bin/clang-tidy

      # A pull request checks the sources its change reaches, a changed
      # source or one that includes a changed header; a push to main checks
      # every source.
      - name: Tidy
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base=""
          fi
          python3 tools/tidy/touched.py build/tidy/compile_commands.json \
            ${base:+"$base"} > "$RUNNER_TEMP/touched"
          if [ ! -s "$RUNNER_TEMP/touched" ]; then
            echo "the change reaches no source of the library"
            exit 0
          fi
          echo "checking $(wc -l < "$RUNNER_TEMP/touched") sources"
          xargs run-clang-tidy-23 -p build/tidy -j "$(nproc)" -quiet \
            < "$RUNNER_TEMP/touched"

  # The one check to require: green when every job passed or was skipped
  # by the changes gate, whose skipped matrix jobs report no names of
  # their own.
  ok:
    name: ok
    needs: [changes, check, build, memory, fuzz, tidy]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            to_entries
            | all(.value.result == "success" or .value.result == "skipped")'
