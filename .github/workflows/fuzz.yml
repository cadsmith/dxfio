name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/llvm
        with:
          packages: clang-23 libclang-rt-23-dev

      - name: Configure
        run: cmake --preset fuzz -DCMAKE_CXX_COMPILER=/usr/lib/llvm-23/bin/clang++

      - name: Build
        run: cmake --build --preset fuzz

      - uses: actions/cache/restore@v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz each target for twenty minutes
        run: |
          mkdir -p "$RUNNER_TEMP/found"
          failed=0
          for target in dxf escapes tags; do
            mkdir -p "corpus/$target"
            "build/fuzz/bin/dxfio_fuzz_$target" \
              -max_total_time=1200 \
              -dict=tests/fuzz/dxf.dict \
              -artifact_prefix="$RUNNER_TEMP/found/$target-" \
              "corpus/$target" tests/fuzz/corpus tests/fuzz/found || failed=1
          done
          exit "$failed"

      # Keep what the run found: a new cache entry each time, the newest
      # restored by every later run, pull requests included.
      - uses: actions/cache/save@v6.1.0
        if: always()
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/found
          if-no-files-found: ignore
