name: MSVC
description: >
  Puts the x64 tools of the newest Visual Studio with C++ on the path for the
  steps after it, as its Developer Command Prompt does, with no Node.js action

runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        if (-not $vs) { throw 'no Visual Studio with the C++ tools' }

        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        $after = cmd /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "$vcvars failed" }

        # What vcvars changed goes to the later steps: new directories of
        # PATH through GITHUB_PATH, in their order, the rest through
        # GITHUB_ENV.
        $known = $env:PATH -split ';'
        $added = @()
        foreach ($line in $after) {
          $name, $value = $line -split '=', 2
          if ($null -eq $value -or $before[$name] -eq $value) { continue }
          if ($name -eq 'Path') {
            $added = @($value -split ';' | Where-Object { $_ -and $known -notcontains $_ })
          } else {
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
        }
        [array]::Reverse($added)
        $added | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        Write-Host "MSVC from $vs, $($added.Count) directories added to PATH"
