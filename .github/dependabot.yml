version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # CodeQL's init and analyze steps fail unless they run the same version.
    groups:
      codeql-action:
        patterns: ['github/codeql-action*']
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # fumadocs-ui pins fumadocs-core to its own exact version.
    groups:
      fumadocs:
        patterns: ['fumadocs-*', '@fumadocs/*']
