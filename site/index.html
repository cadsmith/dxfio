<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dxfio: read and write DXF in C++</title>
    <meta name="description" content="dxfio is a C++23 library that reads and writes AutoCAD DXF, ASCII and binary, every release from R10 to R2018, nothing lost." />
    <script>
      try {
        const chosen = localStorage.getItem('dxfio-theme')
        const dark = chosen ? chosen === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
